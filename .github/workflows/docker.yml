name: Docker


on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - 'docker/**'
      - '!docker/Dockerfile'
      - '.github/**'
      - '!.github/workflows/docker.yml'
  workflow_dispatch:


jobs:
  build-and-push:
    name: Build and Push
    uses: promethei-project/github-actions/.github/workflows/docker-reusable.yml@main
    with:
      docker_file: docker/Dockerfile
      dockerhub_repo: durabilitylabs/promethei-contracts
      tag_latest: ${{ github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/') }}
    secrets: inherit
